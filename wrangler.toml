name = "asocijacije"
main = "src/worker.js"
compatibility_date = "2026-09-23"
workers_dev = true
preview_urls = false

[observability]
enabled = true

# index.html i sw.txt se ugrade u Worker kao tekst, ikone kao binarni podaci
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Svaka soba je jedan Durable Object (drži igru i WebSocket veze)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Migracije se nikad ne brišu ni mijenjaju, samo se dodaju nove.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
